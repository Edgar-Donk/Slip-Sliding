
<style>
:root {
    --width: 14em;
}
.wrap {
  display: flex;
  flex-direction: column-reverse;
  position: relative;
  width: var(--width);
  color: #ccc;
  font: 1em/1 "Trebuchet MS", tahoma, sans-serif;
}

.labels {
  position: absolute;
  bottom: 0;
  left: 0.75em;
}
.labels span {
  position: absolute;
  left: calc(var(--i) * var(--width) / 14 * 1.25);
  /*transform: translate(-50%) scale(0.9);*/
  font-weight: 700;
}







</style>

<div class="wrap">
  <input id="r" type="range" list="dl">
  <label for="r">multiplier
  <!-- used to calculate label positions, div not really allowed -->
    <span class="labels" aria-hidden="true">
       <span style="--i: 0">0</span>
       <span style="--i: 1">10</span>
       <span style="--i: 3">30</span>
       <span style="--i: 6">60</span>
       <span style="--i: 10">100</span>
    </span>
    
  </label>
  <datalist id="dl">
    <option value="0" label="0"></option>
    <option value="10" label="10"></option>
    <option value="20"></option>
    <option value="30" label="30"></option>
    <option value="40"></option>
    <option value="50"></option>
    <option value="60" label="60"></option>
    <option value="70"></option>
    <option value="80"></option>
    <option value="90"></option>
    <option value="100" label="100"></option>
  </datalist>
</div>
