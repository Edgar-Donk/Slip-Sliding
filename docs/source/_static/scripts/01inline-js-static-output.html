<!DOCTYPE html>
<html lang="en">
   <head>
   <meta charset="utf-8">
   <title>Slider Static Output Inline JS</title>
   <link rel="stylesheet" href="../css/slider-style.css">
   </head>
   <body>
      <div class="wrap">   
         <label>Static Output using Inline Javascript</label>
         <input type="range" min="0" max="50" value="0"
                oninput="this.nextElementSibling.value = this.value"> 
            <output>Move the Slider</output>
      </div>            
   </body>
</html>
