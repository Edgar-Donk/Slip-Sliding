<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <link rel="icon" href="../ben1.ico" type="image/x-icon">
   <title>Creating Duotone Images</title>

<style>

/* || GENERAL STYLES */

body {
   box-sizing: border-box;
   font-family: "Open Sans", sans-serif;
  --gray: 0.55;
  --bright: 0.55;
  --l-2: 0.55;
  --c-2: 0.55;
  --h-2: 180; 
   --l-3: 0.55;
  --c-3: 0.55;
  --h-3: 180;
  --blend-2: difference;
  --blend-3: exclusion; 

   --thumbs-width: 114px;
  --image-wrap-width: 800px;
  --wrap-a-width: 25rem;
}


h2, p {
  text-align: center;
}

/* || UTILITIES */
image-wrap {
   display: block;
   position: relative;
  width: var(--image-wrap-width);
  aspect-ratio: 16 / 9;
  margin: auto;
  margin-bottom: 20px;
} 

wrap-controls {
   display: block;
     display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  gap: 1rem;
  justify-content: center;
  overflow: hidden;
}

wrap-a { 
     width: var(--wrap-a-width);
     border: 1px solid silver;
     border-radius: 1em;
     background-color: ghostwhite;
     padding: 1em 0 1em 0;
     text-align: center;
     overflow: hidden;
     max-height: 130px;
     }

wrap-ag { 
     width: var(--wrap-a-width);
     border: 1px solid silver;
     border-radius: 1em;
     background-color: ghostwhite;
     padding: 1em 0 1em 0;
     text-align: center;
     overflow: hidden;
     min-height: 152px;
     }
       
/* || SITEWIDE */
.thumbs {
  position: relative;
  width: var(--thumbs-width);
  aspect-ratio: 16 / 9;
}

row-1 {
  display: flex;
  flex-direction: row;
  gap: 1rch;
  text-align: center;
}

form {
  display: flex;
  flex-direction: row;
  justify-content: center;
  align-items: center;
}

.layer {
  position: absolute;
  width: 100%;
  height: 100%;
}

.layer1 {
  background-image: url(../../images/waves.webp);
  background-size: cover;
  filter: grayscale(var(--gray)) brightness(var(--bright));
}

.layer2 {
  background: oklch(var(--l-2) var(--c-2) var(--h-2));
  mix-blend-mode: var(--blend-2);
}

.layer3 {
  background: oklch(var(--l-3) var(--c-3) var(--h-3));
  mix-blend-mode: var(--blend-3);
}

#mix2 {
    mix-blend-mode: var(--blend-2);
}

#mix3 {
    mix-blend-mode: var(--blend-3);
}


#rect-1 {
    width: 3rem; 
    height: 2rem; 
    background-color: orange; 
    filter: grayscale(var(--gray)) brightness(var(--bright));
    border: 1px solid #e4e4e7;
    border-radius: 2px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

rect-2 {
   width: 3rem; 
   height: 2rem; 
   background-color: oklch(var(--l-2) var(--c-2) var(--h-2));
   border: 1px solid #e4e4e7;
    border-radius: 2px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

rect-3 {
   width: 3rem; 
   height: 2rem; 
   background-color: oklch(var(--l-3) var(--c-3) var(--h-3));
   border: 1px solid #e4e4e7;
    border-radius: 2px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

input[type="range"] {
  width: calc(var(--wrap-a-width) - 18rch); 
}

/* styling for radio thumbnails */

[type=radio] {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
}

[type=radio] + img {
  cursor: pointer;
  border: 2px solid transparent;
  transition: border-color 0.3s ease;
}

[type=radio]:checked + img {
  border-color: #007bff;
  box-shadow: 0 0 8px rgba(0, 123, 255, 0.5);
}

[type=radio]:hover + img {
  opacity:0.7;
  cursor: pointer;
}
/*
input[type="radio"]:focus-visible + img {
    outline: solid 2px #007bff;  /* Outline when focused via keyboard */
    box-shadow: 0 0 8px rgba(0, 123, 255, 0.5);
}
*/
input[type="radio"]:checked:focus-visible + img {
    outline: solid 1px #007bff;   /* Outline when both checked and focused */
    box-shadow: 0 0 8px rgba(0, 123, 255, 0.5);
}


/* || STORE PAGES */

</style>
</head>
   <body>
<h2>Create Duotones</h2>
<image-wrap>
  <div id="theimage" class="layer layer1"></div>
  <div class="layer layer2"></div>
  <div class="layer layer3"></div>
</image-wrap>
<p>Change the main image by clicking on a different thumbnail.</p>

<form id="thumbform" autocomplete="off">
   
<label>
  <input type="radio" name="thumb" value="images/waves.webp" checked>
  <img id="firstThumb" class="thumbs" src="images/waves.webp" alt="waves">
</label>

<label>
  <input type="radio" name="thumb" value="images/face-to-face.avif">
  <img class="thumbs" src="images/face-to-face.avif" alt="face to face">
</label>

<label>
  <input type="radio" name="thumb" value="images/offices.avif">
  <img class="thumbs" src="images/offices.avif" alt="offices">
</label>

<label>
  <input type="radio" name="thumb" value="images/grouse.avif">
  <img class="thumbs" src="images/grouse.avif" alt="grouse">
</label>
</form>

<wrap-controls>
<wrap-a>
    <row-1>
   <legend><em>&nbsp;Layer 1</em></legend>
   <span>Changes from Orange to Black/Gray</span>
   <rect-1 id="rect-1"></rect-1>
    </row-1>

   <label>Grayscale&nbsp;
    <input type="range" id="grayscale1" min="0" max="1" value="0.5" step="0.01" name="--gray" >
     <output for="grayscale1">0.55</output>
     </label>
    <label>Brightness
    <input type="range" id="brightness1" min="0" max="1.5" value="0.5" step="0.01" name="--bright" >
     <output for="brightness1">0.55</output>
     </label>

</wrap-a>

<wrap-a>
   <row-1>
   <legend><em>&nbsp;Layer 2</em></legend>
   <rect-2 id="rect-2"></rect-2>
       <label>Blend Mode Layer 2</label>
    <select id="blendMode2" name="--blend-2">
      <option value="normal">Normal</option>
      <option value="multiply">Multiply</option>
      <option value="screen">Screen</option>
      <option value="overlay">Overlay</option>
      <option value="darken">Darken</option>
      <option value="lighten">Lighten</option>
      <option value="color-dodge">Color Dodge</option>
      <option value="color-burn">Color Burn</option>
      <option value="hard-light">Hard Light</option>
      <option value="soft-light">Soft Light</option>
      <option value="difference" selected>Difference</option>
      <option value="exclusion">Exclusion</option>
      <option value="hue">Hue</option>
      <option value="saturation">Saturation</option>
      <option value="color">Color</option>
      <option value="luminosity">Luminosity</option>
    </select>
    </row-1>
    
   <label>Luminosity
   <input type="range" name="--l-2" min="0.0" max="1.0" value="0.5" step="0.01"> 
    <output id="l">0.55</output>
    </label>
    <label>Chroma&nbsp;&nbsp;&nbsp;
    <input type="range" name="--c-2" min="0.0" max="1.0" value="0.5" step="0.01">
    <output id="c">0.55</output>
    </label>
    <label>Hue&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
    <input type="range" name="--h-2" min="0" value="180" max="360" step="1">
    <output id="h">180</output>
    </label>

</wrap-a>   
<wrap-a>
   <row-1>
   <legend><em>&nbsp;Layer 3</em></legend>
   <rect-3 id="rect-3"></rect-3>
   <label>Blend Mode Layer 3</label>
    <select id="blendMode3" name="--blend-3">
      <option value="normal">Normal</option>
      <option value="multiply">Multiply</option>
      <option value="screen">Screen</option>
      <option value="overlay">Overlay</option>
      <option value="darken">Darken</option>
      <option value="lighten">Lighten</option>
      <option value="color-dodge">Color Dodge</option>
      <option value="color-burn">Color Burn</option>
      <option value="hard-light">Hard Light</option>
      <option value="soft-light">Soft Light</option>
      <option value="difference">Difference</option>
      <option value="exclusion" selected>Exclusion</option>
      <option value="hue">Hue</option>
      <option value="saturation">Saturation</option>
      <option value="color">Color</option>
      <option value="luminosity">Luminosity</option>
    </select>
    </row-1>
    
   <label>Luminosity
   <input type="range" name="--l-3" id="l-3" min="0.0" max="1.0" value="0.5" step="0.01"> 
   <output for="l-3">0.55</output>
   </label>
    <label>Chroma&nbsp;&nbsp;&nbsp;
    <input type="range" name="--c-3" id="c-3" min="0.0" max="1.0" value="0.5" step="0.01">
    <output for="c-3">0.55</output>
    </label>
    <label>Hue&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
    <input type="range" name="--h-3" id="h-3" min="0" value="180" max="360" step="1">
      <output for="h-3">180</output>
      </label>
      
    
</wrap-a> 
<wrap-ag>
   <h3>Generated Settings:</h3>
   <pre><code id="generated"></code></pre>
</wrap-ag>
</wrap-controls>  

<script>
const generated = document.getElementById('generated');
const rect1 = document.getElementById("rect-1");
const lay2 = document.querySelector(".layer2");
const lay3 = document.querySelector(".layer3");
const radioButtons = document.querySelectorAll('input[name="thumb"]');
const theImage = document.getElementById('theimage');

// slider and dropdown selector
addEventListener("input", e => {
    const inp = e.target;
    console.log("inp", inp);
    const effect = inp.value+(inp.dataset.suffix||'');
    const hasRange = e.target.matches('input[type="range"]');
    // check if slider, then use effect to change output, selector shows already
    if (hasRange) {
      inp.nextElementSibling.value = effect;
    };
    // both slider and selector change elements 
    document.body.style.setProperty(inp.name, effect);
   
    const filter = window.getComputedStyle(rect1);
    const stLay2 = window.getComputedStyle(lay2);
    const stLay3 = window.getComputedStyle(lay3);
    
    generated.innerText = `Layer 1 
    ${filter.getPropertyValue("filter")}
    
    Layer 2
     ${stLay2.getPropertyValue("background-color")}
     ${stLay2.getPropertyValue("mix-blend-mode")}
     
    Layer 3
    ${stLay3.getPropertyValue("background-color")} 
    ${stLay3.getPropertyValue("mix-blend-mode")}`;
});

// Find the initially checked radio button
const initialCheckedRadio = document.querySelector('input[name="thumb"]:checked');
document.addEventListener('DOMContentLoaded', function() {
   if (initialCheckedRadio) {
      theImage.style.backgroundImage = `url(${initialCheckedRadio.value})`;
   } 
});

// normal image change
const thumbNail = document.getElementById('thumbform');

    thumbNail.addEventListener('change', (e) => {
     theImage.style.backgroundImage = `url(${e.target.value})`;
});


</script>
   </body>
</html>
