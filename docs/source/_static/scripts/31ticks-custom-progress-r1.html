<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="utf-8">
<title>Customised Slider Ticks</title>
<style>


.wrap {
   /*width: 30em;*/
     border: 1px solid silver;
     border-radius: 1em;
     background-color: ghostwhite;
     padding: 0 1em 1em 1em;
  display: flex;
  flex-direction: column-reverse;
  position: relative;
  width: 14em;
  /*text-align: center;
     align-items: center;
     justify-content: center;*/
     margin: auto;
  color: #ccc;
  font: 1em/1 "Trebuchet MS", tahoma, sans-serif;
}

[type=range] {
  --range: calc(var(--max) - var(--min));
  --ratio: calc((var(--val) - var(--min))/var(--range));
  --sx: calc(.5*1.5em + var(--ratio)*(100% - 1.5em));
  margin: 0;
  padding: 0;
  width: 100%;
  height: 3em;
  background: repeating-linear-gradient(90deg, #ccc 0, #ccc 2px, transparent 0, transparent 1.25em) calc(.5*(1.5em - 2px)) 1.875em/calc(12.5em + 2px) 0.75em no-repeat;
  font: inherit;
}
[type=range], [type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
}
[type=range]::-webkit-slider-runnable-track {
  box-sizing: border-box;
  border: none;
  width: 14em;
  height: 0.25em;
  background: #ccc;
}

.js [type=range]::-webkit-slider-runnable-track {
  background: linear-gradient(#95a, #95a) 0/var(--sx) 100% no-repeat #ccc;
}

[type=range]::-moz-range-track {
  box-sizing: border-box;
  border: none;
  width: 14em;
  height: 0.25em;
  background: #ccc;
}
[type=range]::-ms-track {
  box-sizing: border-box;
  border: none;
  width: 14em;
  height: 0.25em;
  background: #ccc;
}
[type=range]::-moz-range-progress {
  height: 0.25em;
  background: #95a;
}
[type=range]::-ms-fill-lower {
  height: 0.25em;
  background: #95a;
}
[type=range]::-webkit-slider-thumb {
  margin-top: -0.625em;
  box-sizing: border-box;
  border: none;
  width: 1.5em;
  height: 1.5em;
  border-radius: 50%;
  background: #ccc;
}
[type=range]::-moz-range-thumb {
  box-sizing: border-box;
  border: none;
  width: 1.5em;
  height: 1.5em;
  border-radius: 50%;
  background: #ccc;
}
[type=range]::-ms-thumb {
  margin-top: 0;
  box-sizing: border-box;
  border: none;
  width: 1.5em;
  height: 1.5em;
  border-radius: 50%;
  background: #ccc;
}
[type=range]::-ms-tooltip {
  display: none;
}
[type=range]:focus {
  outline: none;
}
[type=range]:focus::-webkit-slider-thumb {
  background: #f90;
}
[type=range]:focus::-moz-range-thumb {
  background: #f90;
}
[type=range]:focus::-ms-thumb {
  background: #f90;
}
[type=range]:focus ~ label span {
  color: #95a;
}
[type=range] ~ label {
  color: #333;
}
[type=range] ~ label span {
  color: #ccc;
}
[type=range] ~ label:after {
  margin: -4px;
  content: ":";
}

.labels {
  position: absolute;
  bottom: 0;
  left: 1.75em; /* left: 0.75em; */
}
.labels span {
  position: absolute;
  left: calc(var(--i)*1.25em); /*   gives position of numbers */
  transform: translate(-50%) scale(0.9);
  font-weight: 700;
}




</style>
</head>
<body>
<div class="wrap">
   
  <input id="r" type="range" list="dl" style="--min: 0;
             --max: 100;
             --val: 50;">
  <label for="r">multiplier
  <!-- used to calculate label positions, div not really allowed -->
    <span class="labels" aria-hidden="true">
      <span style="--i: 0">0</span>
      <span style="--i: 1">10</span>
      <span style="--i: 3">30</span>
      <span style="--i: 6">60</span>
      <span style="--i: 10">100</span>
    </span>
    
  </label>
  <span>Customised Slider with Ticks</span>
  <datalist id="dl">
    <option value="0" label="0"></option>
    <option value="10" label="10"></option>
    <option value="20"></option>
    <option value="30" label="30"></option>
    <option value="40"></option>
    <option value="50"></option>
    <option value="60" label="60"></option>
    <option value="70"></option>
    <option value="80"></option>
    <option value="90"></option>
    <option value="100" label="100"></option>
  </datalist>
</div>
</body>
<script>

document.documentElement.classList.add('js');

addEventListener('input', e => {
  e.target.style.setProperty('--val', e.target.value);
}, false);
</script>
</html>
