   <!DOCTYPE html>
   <html lang="en">
   <head>
   <meta charset="utf-8">
   <title>Tick Slider</title>
   <link rel="stylesheet" href="../css/slider-style.css">
   </head>
   <body>   
      <div class="wrap">
         <h2>Choose a Comfortable Temperature</h2>
         <label>Slider with Ticks</label>
         <input type="range" min="0" max="50" value="40" step="10" list="steplist">
         <datalist id="steplist">
           <option>0 </option>
           <option>10</option>
           <option>20</option>
           <option>30</option>
           <option>40</option>
           <option>50</option>
        </datalist>
      </div>
   </body>
   </html>
