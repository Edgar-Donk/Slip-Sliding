<!DOCTYPE html>
<html lang="en">
   <head>
   <meta charset="utf-8">
   <title>Slider Spinbox Crossover Inline JS</title>
   <link rel="stylesheet" href="../css/slider-style.css">
   </head>
   <body>
   <div class="wrap">   
      <label>Slider Spinbox Crossover using Inline Javascript</label>
      <input id="slider" type="range" value="70" oninput="amount.value=slider.value" >
      <input id="amount" type="number" value="70" min="0" max="100" oninput="slider.value=amount.value" >
   </div>
   </body>
</html>
