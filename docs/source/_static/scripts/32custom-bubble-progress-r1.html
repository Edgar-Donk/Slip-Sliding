   <!DOCTYPE html>
   <html lang="en">
   <head>
      <meta charset="utf-8">
      <title>Ana Bubble Slider</title>
   <style>
   
   /* font font-size/line-height */
   .wrap {
     display: flex;
     align-items: center;
     position: relative;
     width: 12.5em;
     height: 6.25em;
     font: 1em/1 arial, sans-serif;
     margin: auto;
   }
   
   [type=range] {
      --range: calc(var(--max) - var(--min));
      --ratio: calc((var(--val) - var(--min))/var(--range));
      --sx: calc(.5*1.5em + var(--ratio)*(100% - 1.5em)); 
     flex: 1;
     margin: 0;
     padding: 0;
     min-height: 1.5em;
     background: transparent;
     font: inherit;
   }
   
   [type=range], [type=range]::-webkit-slider-thumb {
     -webkit-appearance: none;
   }
   
   [type=range]::-webkit-slider-runnable-track {
     box-sizing: border-box;
     border: none;
     width: 12.5em;
     height: 0.25em;
     background: #ccc;
   }
   
   .jsprog [type=range]::-webkit-slider-runnable-track {
     background: linear-gradient(#95a, #95a) 0/var(--sx) 100% no-repeat #ccc;
   }
   
   [type=range]::-moz-range-track {
     box-sizing: border-box;
     border: none;
     width: 12.5em;
     height: 0.25em;
     background: #ccc;
   }
   
   [type=range]::-ms-track {
     box-sizing: border-box;
     border: none;
     width: 12.5em;
     height: 0.25em;
     background: #ccc;
   }
   
   [type=range]::-moz-range-progress {
     height: 0.25em;
     background: #95a;
   }
   [type=range]::-ms-fill-lower {
     height: 0.25em;
     background: #95a;
   }
   
   [type=range]::-webkit-slider-thumb {
     margin-top: -0.625em;
     box-sizing: border-box;
     border: none;
     width: 1.5em;
     height: 1.5em;
     border-radius: 50%;
     background: #f90;
   }
   
   [type=range]::-moz-range-thumb {
     box-sizing: border-box;
     border: none;
     width: 1.5em;
     height: 1.5em;
     border-radius: 50%;
     background: #f90;
   }
   
   [type=range]::-ms-thumb {
     margin-top: 0;
     box-sizing: border-box;
     border: none;
     width: 1.5em;
     height: 1.5em;
     border-radius: 50%;
     background: #f90;
   }
   
   [type=range]::-ms-tooltip {
     display: none;
   }
    
   [type=range] ~ output {
     display: none;
   }
   
   /* translate parse error, [tx, ty]
    storing the current slider value into a --val variable and then using
    a calc() value depending on this variable for the position. 
    
    ~ subsequent sibling combinator (output follows type range)*/
    
   .js [type=range] ~ output {
     display: block;
     position: absolute;
     left: 0.75em;
     top: 0;
     padding: 0.25em 0.5em;
     border-radius: 3px;
     transform: translate(calc((var(--val) - var(--min))/(var(--max) - var(--min))*11em - 50%));
     background: #95a;
     color: #eee;
   }
   
   </style>
   </head>
   <body>
   <div class="wrap" style="--min: 0;
                --max: 100;
                --val: 50;">
     <input id="r" type="range">
     <output for="r">50</output>
     
   </div>
   
   <script>
   
   // adding elements js and jsprog
   document.documentElement.classList.add('js');
   document.documentElement.classList.add('jsprog');
   
   addEventListener('input', e => {
     
     e.target.parentNode.style.setProperty('--val', +e.target.value);
     e.target.nextElementSibling.value = e.target.value;
   }, false);
   
   </script>
   </body>
   </html>
